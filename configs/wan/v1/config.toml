task = "i2v-14B"

dit = "/workspace/models/diffusion_models/wan2.1_i2v_720p_14B_bf16.safetensors"
# dit_high_noise, timestep_boundary は WAN2.2 限定の設定
dataset_config = "/workspace/impostor/configs/wan/v1/dataset.toml"

# cacheでのみ使用する
vae = "/workspace/models/vae/wan_2.1_vae.safetensors"
t5 = "/workspace/models/text_encoder/models_t5_umt5-xxl-enc-bf16.pth"
clip = "/workspace/models/clip_vision/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth"

sdpa = true
# flash_attn = true   # または --sdpa, --xformers, --flash_attn

# <https://github.com/kohya-ss/musubi-tuner/blob/main/docs/wan.md#model-support-matrix--モデルサポートマトリックス> を参照
mixed_precision = "bf16"

optimizer_type = "adamw8bit"
learning_rate = 2e-4
gradient_checkpointing = true
max_data_loader_n_workers = 2
persistent_data_loader_workers = true

network_module = "networks.lora_wan"

# LoRAの隠れ層のニューロンの数であり、（順伝播時の影響がニューロン数に比例して大きくならないように）重み値を調整する係数の分母でもある。
# https://deepwiki.com/search/networkdimalphaalpha05025alpha_6132b736-e130-4aec-a97d-90668c4afec1
network_dim = 32
# network_alpha = 32

timestep_sampling = "shift"
discrete_flow_shift = 5.0

# どうせ途中で止めるので...
max_train_steps = 5000

# データセットのサイズを変更して試しているので steps数指定の方が良い
# 100で良い、仮に200づつしか使わなくても、最新の状況を見て学習を進めるか止めるか判断すると思うので
save_every_n_steps = 500

seed = 42

output_dir = "output"
output_name = "impostor-wan/v1"

blocks_to_swap = 20

save_state = true
save_state_on_train_end = true

log_with = "wandb"
log_tracker_name = "impostor-wan"
log_config = true

huggingface_repo_id = "sawara-dev/impostor-models"
huggingface_repo_type = "model"
huggingface_path_in_repo = "/wan2.1"
save_state_to_huggingface = true

# Sampling options
sample_at_first = true
sample_every_n_steps = 100
sample_prompts = "/workspace/impostor/configs/wan/v1/prompts.txt"
