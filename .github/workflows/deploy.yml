name: Deploy to Cloud Run
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"
      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: asia-northeast1-docker.pkg.dev/sawara-dev/impostor/impostor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy impostor \
            --image asia-northeast1-docker.pkg.dev/sawara-dev/impostor/impostor:${{ github.sha }} \
            --region asia-northeast1 \
            --cpu=1 \
            --memory=2Gi \
            --min-instances=1 \
            --max-instances=1 \
            --update-secrets MODAL_TOKEN_ID=modal-token-id:latest,MODAL_TOKEN_SECRET=modal-token-secret:latest,SUPABASE_URL=supabase-url:latest,SUPABASE_ANON_KEY=supabase-anon-key:latest,GRADIO_SESSION_SECRET=gradio-session-secret:latest
            # memory=2Gi: エラーを避ける。Memory limit of 1024 MiB exceeded with 1037 MiB used.
            # cpu=1: memoryが2Giの場合はcpu=1が最低ライン。
            # min-instances=1: 初回起動に30秒ほどかかるのを避ける。
            # max--instances=1: 画像を扱う際のエラーを避ける。FileNotFoundError: [Errno 2] No such file or directory: '/tmp/gradio/...
