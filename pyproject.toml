[project]
name = "imposter"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hatchling",
    "setuptools",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "huggingface-hub[cli]",
    "jinja2-cli>=0.8.2",
    "wandb>=0.21.1",
    "accelerate",
    "musubi-tuner[cu128]",
    "hf-transfer>=0.1.9",
    "gradio>=6.1.0",
    "pillow>=12.0.0",
    "opencv-python>=4.10.0.84",
    "sageattention>=1.0.6",
]

[tool.uv]
link-mode = "copy"
no-build-isolation = true

[tool.uv.extra-build-dependencies]
musubi-tuner = ["hatchling"]
sageattention = ["torch"]

[tool.uv.sources]
musubi-tuner = { git = "https://github.com/kohya-ss/musubi-tuner" }
