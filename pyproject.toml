[project]
name = "impostor"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "huggingface-hub[cli]",
    "jinja2-cli>=0.8.2",
    "wandb>=0.21.1",
    "accelerate",
    "musubi-tuner[cu128]",
    "hf-transfer>=0.1.9",
    "sageattention>=1.0.6",
    "fastapi[standard]>=0.125.0",
    "python-dotenv~=1.0.0",
    "jinja2>=3.1.6",
    "diffsynth",
]

[project.optional-dependencies]
eval = [
    "open_clip_torch",
    "lpips",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "ty>=0.0.4",
]

[tool.uv]
link-mode = "copy"

[tool.uv.extra-build-dependencies]
diffsynth = ["setuptools"]
musubi-tuner = ["hatchling"]
sageattention = ["torch"]

[tool.uv.sources]
musubi-tuner = { git = "https://github.com/kohya-ss/musubi-tuner" }
diffsynth = { git = "https://github.com/xhiroga/DiffSynth-Studio" }

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
